<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- SEO -->
		<meta
			name="description"
			content="Site officiel d'inscription du Saint-Pierre Basket Ball (SPBB). Inscriptions, licences, gestion de son profil."
		/>
		<!-- Favicon -->
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Saint-Pierre Basket Ball - SPBB" />
		<meta
			property="og:description"
			content="Rejoignez le Saint-Pierre Basket Ball. Inscriptions, informations licences et actualités du club."
		/>
		<meta property="og:image" content="/og-image.png" />
		<meta property="og:url" content="https://spbb.fr" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Saint-Pierre Basket Ball - SPBB" />
		<meta
			name="twitter:description"
			content="Inscriptions et informations du club Saint-Pierre Basket Ball."
		/>
		<meta name="twitter:image" content="/og-image.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
